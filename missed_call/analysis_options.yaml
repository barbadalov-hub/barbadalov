# Mirrors the LifeOS root strictness so the game module holds the same bar,
# even though it is analyzed as its own package (excluded from the app's run).
include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  errors:
    unawaited_futures: error
    dead_code: error

linter:
  rules:
    - always_declare_return_types
    - prefer_const_constructors
    - prefer_final_locals
    - unawaited_futures
    - sort_child_properties_last
